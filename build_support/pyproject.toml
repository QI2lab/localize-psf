[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "localize-psf-build-support"
version = "0.1.0"
description = "Environment-local CUDA toolchain for localize-psf native builds."
requires-python = ">=3.12"
dependencies = ["cmake==3.31.10"]

[project.scripts]
localize-gpu-cmake = "localize_psf_build_support.cmake:main"

[tool.hatch.build]
exclude = ["**/_build_tools/**"]

[tool.hatch.build.targets.wheel]
packages = ["localize_psf_build_support"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "localize_psf_build_support/pyproject.toml"

[tool.uv]
cache-keys = [
  {file = "pyproject.toml"},
  {file = "localize_psf_build_support/*.py"},
  {file = "localize_psf_build_support/cmake/*.cmake"},
]

# CUDA and host compiler artifacts installed only inside GPUfit's isolated build.
