[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "localize_psf"
version = "0.2.0"
description = "Localization and PSF fitting for three-dimensional microscopy."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "QI2lab and Peter T. Brown"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=2", "scipy>=1.14", "numba>=0.61", "matplotlib>=3.9", "joblib>=1.4",
  "dask>=2024.10", "zarr>=2.18,<3",
]

[project.urls]
Repository = "https://github.com/QI2lab/localize-psf"
Documentation = "https://localize-psf.readthedocs.io"

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13,<15"]
psfmodels = ["psfmodels>=0.3.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]
docs = ["sphinx>=8,<9", "sphinx-rtd-theme>=3,<4"]

[tool.hatch.build.targets.wheel]
packages = ["localize_psf"]

[tool.hatch.build.targets.sdist]
include = ["localize_psf", "tests", "docs", "scripts", "README.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version"]
exclude = ["docs/_*", "docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_unittest.py"]
markers = ["gpu: requires the tested QI2lab native GPUfit artifact and CUDA device", "monte_carlo: repeated noisy-image uncertainty validation"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
